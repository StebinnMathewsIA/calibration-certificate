# Render blueprint — deploys the FastAPI signing service from this repo.
# Dashboard: New -> Blueprint -> select this repository. Fill in the secret
# env vars when prompted (values match the GitHub Actions secrets; see
# docs/TESTING.md "Backend deployment" and issue #2).
services:
  - type: web
    name: prowalco-calibration-api
    runtime: docker
    # Paid plan is REQUIRED, not a nicety: Prowalco's firewall allowlists
    # this service's outbound address so the Syspro sync can reach their
    # SQL Server (docs/SYSPRO-INTEGRATION.md). Free instances do not
    # guarantee a stable egress address across restarts, and a rotated
    # address fails the allowlist silently. It also removes the cold
    # starts that make every OnKey probe wait on a spin-up.
    # Re-run .github/workflows/egress-ip.yml after ANY plan or region
    # change and tell Prowalco's IT the new address BEFORE the change.
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # PoC signing key: auto-generated at boot (ephemeral, loudly logged).
      # For a stable key, set SIGNING_KEY_PEM_B64 + SIGNING_CERT_PEM_B64
      # instead; production milestone is a KMS-held key.
      - key: SIGNING_AUTOGENERATE_DEV_KEY
        value: "true"
      # Device binding is the second factor (Arch v2 phase 3, #67): sign-in
      # (knowledge) + this device key (possession). TOFU enrollment happens
      # at first sign; ADMIN_EMAILS approves/revokes enrollments.
      - key: DEVICE_BINDING_ENFORCE
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      # OnKey (#47): credentials live ONLY here (Render Environment). Flip
      # WORKORDER_PROVIDER to "onkey" once the provider mapping lands.
      # Production data source (#55): the app serves work orders from the
      # registers mined out of the WOE001 sync. "simulated" remains only for
      # CI tests and local dev.
      - key: WORKORDER_PROVIDER
        value: "onkey"
      - key: ONKEY_BASE_URL
        sync: false
      - key: ONKEY_USERNAME
        sync: false
      - key: ONKEY_PASSWORD
        sync: false
      # WOE001 sync (#47): token shared with the GitHub Actions cron; the
      # report/dataset settings default in code (config.py).
      - key: ONKEY_SYNC_TOKEN
        sync: false
      # Syspro stock catalogue (#135), read-only. Set these in the Render
      # Environment, never here: the repository is public. Leave SYSPRO_HOST
      # unset to disable the endpoints entirely.
      # SYSPRO_PASSWORD is empty because the login Prowalco issued has no
      # password. That is recorded in docs/SYSPRO-INTEGRATION.md and #133,
      # and it is meant to be temporary.
      - key: SYSPRO_HOST
        sync: false
      - key: SYSPRO_PORT
        sync: false
      - key: SYSPRO_DATABASE
        sync: false
      - key: SYSPRO_USER
        sync: false
      - key: SYSPRO_PASSWORD
        sync: false
