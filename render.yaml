# Render blueprint — deploys the FastAPI signing service from this repo.
# Dashboard: New -> Blueprint -> select this repository. Fill in the secret
# env vars when prompted (values match the GitHub Actions secrets; see
# docs/TESTING.md "Backend deployment" and issue #2).
services:
  - type: web
    name: prowalco-calibration-api
    runtime: docker
    # A paid plan removes the cold starts that make every OnKey probe wait
    # on a spin-up. That is the reason it is here.
    #
    # It does NOT give a stable outbound address, which this comment used
    # to claim. Measured 2026-08-11: three deploys produced three different
    # addresses, one per availability zone, while a dozen memory-limit
    # restarts had not moved it at all.
    #
    # RESOLVED 2026-08-11: the workspace now has a DEDICATED IP set, which
    # is what actually pins the address. Prowalco IT allowlists all three
    # of its addresses, so a placement into any zone still lands inside the
    # allowlist and deploys no longer break the Syspro connection.
    #
    # Do not drop the dedicated IP set without telling Prowalco IT first.
    # Losing it fails as a timeout, which looks like a network fault and
    # not like a billing change (docs/SYSPRO-INTEGRATION.md, #133).
    #
    # Memory: 'starter' is 512 MB and the OnKey sync overruns it (#134).
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # PoC signing key: auto-generated at boot (ephemeral, loudly logged).
      # For a stable key, set SIGNING_KEY_PEM_B64 + SIGNING_CERT_PEM_B64
      # instead; production milestone is a KMS-held key.
      - key: SIGNING_AUTOGENERATE_DEV_KEY
        value: "true"
      # Device binding is the second factor (Arch v2 phase 3, #67): sign-in
      # (knowledge) + this device key (possession). TOFU enrollment happens
      # at first sign; ADMIN_EMAILS approves/revokes enrollments.
      - key: DEVICE_BINDING_ENFORCE
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      # OnKey (#47): credentials live ONLY here (Render Environment). Flip
      # WORKORDER_PROVIDER to "onkey" once the provider mapping lands.
      # Production data source (#55): the app serves work orders from the
      # registers mined out of the WOE001 sync. "simulated" remains only for
      # CI tests and local dev.
      - key: WORKORDER_PROVIDER
        value: "onkey"
      - key: ONKEY_BASE_URL
        sync: false
      - key: ONKEY_USERNAME
        sync: false
      - key: ONKEY_PASSWORD
        sync: false
      # WOE001 sync (#47): token shared with the GitHub Actions cron; the
      # report/dataset settings default in code (config.py).
      - key: ONKEY_SYNC_TOKEN
        sync: false
      # Syspro stock catalogue (#135), read-only. Set these in the Render
      # Environment, never here: the repository is public. Leave SYSPRO_HOST
      # unset to disable the endpoints entirely.
      # SYSPRO_PASSWORD is empty because the login Prowalco issued has no
      # password. That is recorded in docs/SYSPRO-INTEGRATION.md and #133,
      # and it is meant to be temporary.
      - key: SYSPRO_HOST
        sync: false
      - key: SYSPRO_PORT
        sync: false
      # SYSPRO_DATABASE defaults to SysproCompanyRSA in config.py. Set it
      # only to override, for example to SysproCompanyH for Lesotho.
      - key: SYSPRO_USER
        sync: false
      - key: SYSPRO_PASSWORD
        sync: false
