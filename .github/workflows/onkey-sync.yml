name: onkey-sync

# The freshness MONITOR and the Render keep-alive. It no longer triggers a
# sync on a schedule, and that is the point of its 2026-08-12 rewrite.
#
# The scheduled trigger it used to carry fired mode=incremental straight at
# the backend, which bypasses the pg_cron session lease entirely: the lease
# guards the KICK, and this was a second, unguarded kicker. Every firing
# put a fifteen-minute 35-day sweep on top of the two-minutely recent sync
# in one 512 MB process, which is the exact overlap #134 exists to end.
# GitHub fired it every 1 to 3 hours through the working day, so the
# "0 overlaps" measured after the lease fix was an artifact of a
# measurement window that happened to miss a firing.
#
# The sweep is pg_cron's job now (migration 096: four times a day, off
# peak, through the lease). What remains here:
#
#   - Scheduled: poll /v1/onkey/status, which both wakes Render and fails
#     red if the work list has gone stale. GitHub emails the repository
#     owner on a failing scheduled workflow, so a red run reaches a person.
#     This check exists because a broken sync once ran red 40 times over
#     three days with nobody looking.
#   - Manual (workflow_dispatch): trigger backfill or derive explicitly.
#     Those are rare, human-initiated, and worth having a button for.
#     Deliberately NOT incremental: the schedule owns that, and a manual
#     incremental would be the same unguarded kick this rewrite removes.
#
# THE SCHEDULE BELOW IS NOT HONOURED PRECISELY. GitHub fires high-frequency
# schedules every 1 to 3 hours under load, and no setting changes that.
# For a monitor that is fine: each firing polices the interval before it.
#
# Required repository secret:
#   ONKEY_SYNC_TOKEN   Must equal the ONKEY_SYNC_TOKEN env var on Render.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual maintenance only (backfill = everything since ONKEY_BACKFILL_START; derive = rebuild registers from stored rows, no OnKey call)"
        type: choice
        default: derive
        options: [backfill, derive]

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      API: https://prowalco-calibration-api.onrender.com
    steps:
      - name: Trigger maintenance mode (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.ONKEY_SYNC_TOKEN }}" ]; then
            echo "::error::Missing repository secret ONKEY_SYNC_TOKEN"
            exit 1
          fi
          mode="${{ inputs.mode }}"
          # Render wakes from sleep on first request; allow time.
          response=$(curl -sS -m 280 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.ONKEY_SYNC_TOKEN }}" \
            "${API}/v1/onkey/sync?mode=${mode}")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP ${code}"
          echo "$body"
          {
            echo "## OnKey ${mode} (manual)"
            echo '```json'
            echo "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ]

      - name: Assert the work list is current
        run: |
          if [ -z "${{ secrets.ONKEY_SYNC_TOKEN }}" ]; then
            echo "::error::Missing repository secret ONKEY_SYNC_TOKEN"
            exit 1
          fi
          status=""
          stale=""
          # A stale reading gets confirmed before it fails the job: a sync
          # recovering right now (or a service that has only just deployed
          # and has no run on record yet) resolves within this window
          # instead of going red.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -m 60 \
              -H "Authorization: Bearer ${{ secrets.ONKEY_SYNC_TOKEN }}" \
              "${API}/v1/onkey/status" || true)
            stale=$(echo "$status" | jq -r '.health.stale' 2>/dev/null || echo "")
            if [ "$stale" = "false" ]; then break; fi
            echo "attempt ${attempt}: stale=${stale:-unreadable}"
            if [ "$attempt" != "6" ]; then sleep 30; fi
          done

          {
            echo "### Store status"
            echo '```json'
            echo "$status" | jq . 2>/dev/null || echo "$status"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$stale" != "true" ] && [ "$stale" != "false" ]; then
            echo "::error::/v1/onkey/status did not return a health block"
            echo "$status"
            exit 1
          fi

          refresh=$(echo "$status" | jq -r '.health.minutesSinceRefresh // "never"')
          minutes=$(echo "$status" | jq -r '.health.minutesSinceSuccess // "never"')
          rows=$(echo "$status" | jq -r '.health.workOrders.rows')
          updated=$(echo "$status" | jq -r '.health.workOrders.lastUpdatedAt // "never"')
          echo "register refreshed ${refresh} minutes ago (${rows} rows, ${updated}); last full run succeeded ${minutes} minutes ago"

          if [ "$stale" = "true" ]; then
            err=$(echo "$status" | jq -r '.health.lastRun.error // "no error recorded"')
            echo "::error::OnKey work list is stale (register refreshed ${refresh} minutes ago). Last run: ${err}"
            exit 1
          fi
