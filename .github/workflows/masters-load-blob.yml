name: masters-load-blob

# Loads the FULL master dataset (#69/#72 follow-up): the data rides the repo
# as an AES-256 ENCRYPTED blob (data/masters.enc — ciphertext only, safe in
# a public repo), and the one-time decryption key arrives as a dispatch
# input read from the runner's event file (never echoed, never committed).
# The job decrypts, splits into endpoint-sized chunks, and posts them to the
# token-protected /v1/onkey/masters, deriving registers on the last chunk.
#
# Required repository secret: ONKEY_SYNC_TOKEN.

on:
  workflow_dispatch:
    inputs:
      key:
        description: "hex decryption key for data/masters.enc"
        required: true
        type: string

env:
  API_URL: https://prowalco-calibration-api.onrender.com

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt, chunk and post
        run: |
          KEY=$(jq -r '.inputs.key' "$GITHUB_EVENT_PATH")
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass "pass:$KEY" \
            -in data/masters.enc | gunzip > /tmp/masters.json
          total=$(jq '.locations | length' /tmp/masters.json)
          techs=$(jq '.technicians | length' /tmp/masters.json)
          echo "Decrypted: $total locations, $techs technicians"
          CH=1800
          chunks=$(( (total + CH - 1) / CH ))
          i=0; n=0
          while [ $i -lt $total ]; do
            n=$((n+1))
            last=false; [ $n -eq $chunks ] && last=true
            jq -c --argjson i $i --argjson c $CH --argjson last $last \
              '{locations: .locations[$i:$i+$c],
                technicians: (if $last then .technicians else [] end),
                derive: $last}' /tmp/masters.json > /tmp/chunk.json
            echo "--- chunk $n/$chunks ($(jq '.locations|length' /tmp/chunk.json) rows, derive=$last)"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              --max-time 280 --retry 3 --retry-delay 10 \
              -X POST "$API_URL/v1/onkey/masters" \
              -H "Authorization: Bearer ${{ secrets.ONKEY_SYNC_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/chunk.json)
            echo "HTTP $code"
            # Counts only — safe for public logs.
            cat /tmp/resp.json; echo
            [ "$code" = "200" ] || exit 1
            i=$((i+CH))
          done
