name: onkey-sync

# Drives the OnKey FIELDOPS - WOE incremental sync (#47) and doubles as the
# keep-alive for the Render instance. Content-hash dedupe server-side means
# each run writes only the delta.
#
# THE SCHEDULE BELOW IS NOT HONOURED. It asks for every 5 minutes; measured
# over 2026-08-04/05 GitHub actually fired it every 1 to 3 hours (15:34,
# 13:24, 11:45, 09:44, 07:07, 04:23, 01:06 ...). High-frequency schedules
# get dropped under load and no setting changes that. Migration 040 moves
# the real trigger to Supabase pg_cron, which does keep its interval; this
# workflow stays as the freshness MONITOR and the Render keep-alive. The
# sync endpoint is single-flight, so both triggers can run without
# colliding.
#
# The sync now runs in a background thread server-side, so HTTP 200 on the
# trigger only proves the request was accepted. This job therefore asserts
# FRESHNESS from /v1/onkey/status: the backend records every pull to
# onkey_sync_runs and reports health.stale once too long has passed with no
# successful run. Because the trigger is asynchronous, the health block read
# here describes the PREVIOUS tick, which is what we want from a 5-minute
# cron: each run polices the one before it.
#
# This check exists because a broken sync once ran red 40 times over three
# days with nobody looking. GitHub emails the repository owner when a
# scheduled workflow starts failing, so a red run here reaches a person.
#
# Required repository secret:
#   ONKEY_SYNC_TOKEN   Must equal the ONKEY_SYNC_TOKEN env var on Render.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode (backfill = everything since ONKEY_BACKFILL_START; derive = rebuild registers from stored rows, no OnKey call)"
        type: choice
        default: incremental
        options: [incremental, backfill, derive]

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      API: https://prowalco-calibration-api.onrender.com
    steps:
      - name: Trigger sync
        run: |
          if [ -z "${{ secrets.ONKEY_SYNC_TOKEN }}" ]; then
            echo "::error::Missing repository secret ONKEY_SYNC_TOKEN"
            exit 1
          fi
          mode="${{ inputs.mode || 'incremental' }}"
          echo "mode=${mode}" >> "$GITHUB_ENV"
          # Render wakes from sleep on first request; allow time.
          response=$(curl -sS -m 280 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.ONKEY_SYNC_TOKEN }}" \
            "${API}/v1/onkey/sync?mode=${mode}")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP ${code}"
          echo "$body"
          {
            echo "## OnKey sync (${mode})"
            echo '```json'
            echo "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ]

      - name: Assert the work list is current
        run: |
          status=""
          stale=""
          # A stale reading gets confirmed before it fails the job. The run
          # just triggered is still in flight, so a sync recovering right
          # now (or a service that has only just deployed and has no run on
          # record yet) resolves within this window instead of going red.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -m 60 \
              -H "Authorization: Bearer ${{ secrets.ONKEY_SYNC_TOKEN }}" \
              "${API}/v1/onkey/status" || true)
            stale=$(echo "$status" | jq -r '.health.stale' 2>/dev/null || echo "")
            if [ "$stale" = "false" ]; then break; fi
            echo "attempt ${attempt}: stale=${stale:-unreadable}"
            if [ "$attempt" != "6" ]; then sleep 30; fi
          done

          {
            echo "### Store status"
            echo '```json'
            echo "$status" | jq . 2>/dev/null || echo "$status"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$stale" != "true" ] && [ "$stale" != "false" ]; then
            echo "::error::/v1/onkey/status did not return a health block"
            echo "$status"
            exit 1
          fi

          refresh=$(echo "$status" | jq -r '.health.minutesSinceRefresh // "never"')
          minutes=$(echo "$status" | jq -r '.health.minutesSinceSuccess // "never"')
          rows=$(echo "$status" | jq -r '.health.workOrders.rows')
          updated=$(echo "$status" | jq -r '.health.workOrders.lastUpdatedAt // "never"')
          echo "register refreshed ${refresh} minutes ago (${rows} rows, ${updated}); last full run succeeded ${minutes} minutes ago"

          if [ "$stale" = "true" ]; then
            err=$(echo "$status" | jq -r '.health.lastRun.error // "no error recorded"')
            echo "::error::OnKey work list is stale (register refreshed ${refresh} minutes ago). Last run: ${err}"
            exit 1
          fi
